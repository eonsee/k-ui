# mayekun.com Nginx 配置示例
# 用法：
#   1. 上传 dist/ 内容到 /usr/share/nginx/html/
#   2. 将本文件放到 /etc/nginx/conf.d/mayekun.conf
#   3. nginx -t && nginx -s reload
#
# 关键点：
#   - location / 使用 try_files 回退到 index.html，解决 /articles、/article/1 刷新 404
#   - /admin/ 与 /upload/ 反代到后端，浏览器始终同域访问，不会触发 CORS
#   - index.html 不缓存，assets 长缓存，发版后能立即生效

server {
    listen 80;
    server_name mayekun.com www.mayekun.com;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # 带 content hash 的构建产物，可以放心长缓存
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 业务接口：同域反代到后端
    location /admin/ {
        proxy_pass http://api.mayekun.com;
        proxy_set_header Host api.mayekun.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }

    # 后台上传的静态资源（图片等）
    location /upload/ {
        proxy_pass http://api.mayekun.com;
        proxy_set_header Host api.mayekun.com;
        expires 30d;
    }

    # 入口页不缓存，保证发版后立即生效
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA 路由回退：任意前端路由都交给 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

